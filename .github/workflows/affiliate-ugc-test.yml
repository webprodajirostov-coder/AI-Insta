name: Affiliate UGC test

on:
  workflow_dispatch:
    inputs:
      image_path:
        description: "Repository path to the tomato paste jar reference image"
        required: true
        default: "experiments/affiliate_ugc/Домашняя томатная паста и улыбка.png"
      prompt_path:
        description: "Prompt file"
        required: true
        default: "experiments/affiliate_ugc/prompts/01_tomato_paste_jar.txt"
      model:
        description: "OdiRouter video model"
        required: false
        default: "seedance-2-0-fast"
      duration:
        description: "Video duration in seconds"
        required: false
        default: "4"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment/affiliate-ugc-mvp

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Generate video
        env:
          ODIROUTER_API_KEY: ${{ secrets.ODIROUTER_API_KEY }}
          ODIROUTER_VIDEO_MODEL: ${{ inputs.model }}
        run: |
          python experiments/affiliate_ugc/generate_video.py \
            --image "${{ inputs.image_path }}" \
            --prompt-file "${{ inputs.prompt_path }}" \
            --output experiments/affiliate_ugc/output/tomato_paste_jar.mp4 \
            --duration "${{ inputs.duration }}"

      - name: Upload generated video
        uses: actions/upload-artifact@v4
        with:
          name: tomato-paste-ugc-test
          path: experiments/affiliate_ugc/output/tomato_paste_jar.mp4
          if-no-files-found: error
